<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#16213e" />
  <!-- Stylized key -->
  <g fill="none" stroke="#f5a623" stroke-width="2.5" stroke-linecap="round"
    stroke-linejoin="round">
    <!-- key bow (ring) -->
    <circle cx="12" cy="12" r="5" />
    <!-- key shaft -->
    <line x1="15.5" y1="15.5" x2="24" y2="24" />
    <!-- key teeth -->
    <line x1="20.5" y1="20.5" x2="22.5" y2="18.5" />
    <line x1="23" y1="23" x2="25.5" y2="20.5" />
  </g>
</svg>
